# 推送 v* 标签时：分别在 Apple 芯片和 Intel 的 macOS 机器上打包、自检，并发布到 GitHub Releases。
# 也可以在 Actions 页面手动运行（只打包、不发布），用来试打包。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple 芯片
            arch: AppleSilicon
          - runner: macos-15-intel    # Intel 芯片
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 打包
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          PYTHON=python ./build.sh "$VERSION"
      - name: 自检（真实跑一次 OCR 和 PDF 生成）
        run: dist/AutoDocCap.app/Contents/MacOS/doccap --selftest
      - name: 检查架构
        run: file dist/AutoDocCap.app/Contents/MacOS/doccap
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist/*.zip

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
